{% extends "base.html" %}

{% block title %}
Login | Property CRM
{% endblock %}

{% block content %}

<div class="card form-card">

    <h1>Property CRM</h1>

    <p>Sign in to continue.</p>

    {% if error %}
        <div class="field-error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
                autofocus
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >

        </div>

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Login
            </button>

        </div>

    </form>

</div>

{% endblock %}
