{% extends "base.html" %}

{% block title %}
Delete User | Property CRM
{% endblock %}

{% block page_heading %}
Delete User
{% endblock %}

{% block content %}

<div class="card">

    <h2>Delete User</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ user_obj.username }}</strong>?
    </p>

    <p>
        This action cannot be undone.
    </p>

    <form method="post">

        {% csrf_token %}

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Yes, Delete
            </button>

            <a
                href="{% url 'user_list' %}"
                class="btn btn-light"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
