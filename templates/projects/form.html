{% extends "base.html" %}

{% block title %}
{{ title }} | Property CRM
{% endblock %}

{% block page_heading %}
{{ title }}
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>{{ title }}</h1>
        <p>Enter project information.</p>
    </div>

    <a
        href="{% url 'project_list' %}"
        class="btn btn-light">
        ← Back
    </a>

</div>


<div class="card form-card">

    <form method="post">

        {% csrf_token %}

        <div class="form-grid">


            <!-- Project Name -->
            <div class="form-group">

                <label>
                    Project Name *
                </label>

                <input
                    type="text"
                    name="name"
                    required
                    value="{{ project.name|default:'' }}"
                    placeholder="Example: Rajapushpa Provincia"
                >

            </div>


            <!-- Developer -->
            <div class="form-group">

                <label>
                    Developer *
                </label>

                <select
                    name="developer"
                    required>

                    <option value="">
                        Select Developer
                    </option>

                    {% for developer in developers %}

                    <option
                        value="{{ developer.id }}"
                        {% if project.developer_id == developer.id %}
                            selected
                        {% endif %}
                    >
                        {{ developer.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Location -->
            <div class="form-group">

                <label>
                    Location *
                </label>

                <select
                    name="location"
                    required>

                    <option value="">
                        Select Location
                    </option>

                    {% for location in locations %}

                    <option
                        value="{{ location.id }}"
                        {% if project.location_id == location.id %}
                            selected
                        {% endif %}
                    >
                        {{ location.name }}, {{ location.city }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Project Type -->
            <div class="form-group">

                <label>
                    Project Type *
                </label>

                <select
                    name="project_type"
                    required>

                    <option value="">
                        Select Type
                    </option>

                    {% for value, label in project_types %}

                    <option
                        value="{{ value }}"
                        {% if project.project_type == value %}
                            selected
                        {% endif %}
                    >
                        {{ label }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Project Status -->
            <div class="form-group">

                <label>
                    Project Status *
                </label>

                <select
                    name="project_status"
                    required>

                    <option value="">
                        Select Status
                    </option>

                    {% for value, label in project_status %}

                    <option
                        value="{{ value }}"
                        {% if project.project_status == value %}
                            selected
                        {% endif %}
                    >
                        {{ label }}
                    </option>

                    {% endfor %}

                </select>

            </div>
           

            <!-- Land Acres -->
            <div class="form-group">

                <label>
                    Total Land (Acres)
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="total_land_acres"
                    value="{{ project.total_land_acres|default:'' }}"
                >

            </div>


            <!-- Land Guntas -->
            <div class="form-group">

                <label>
                    Total Land (Guntas)
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="total_land_guntas"
                    value="{{ project.total_land_guntas|default:'' }}"
                >

            </div>


            <!-- Total Units -->
            <div class="form-group">

                <label>
                    Total Units
                </label>

                <input
                    type="number"
                    name="total_units"
                    min="0"
                    value="{{ project.total_units|default:'' }}"
                >

            </div>


            <!-- BHK -->
            <div class="form-group">

                <label>
                    BHK
                </label>

                <input
                    type="text"
                    name="bhk"
                    value="{{ project.bhk|default:'' }}"
                    placeholder="Example: 3 BHK / 4 BHK"
                >

            </div>


            <!-- Possession -->
            <div class="form-group">

                <label>
                    Possession Date
                </label>

                <input
                    type="date"
                    name="possession_date"
                    value="{{ project.possession_date|date:'Y-m-d' }}"
                >

            </div>


            <!-- RERA Number -->
            <div class="form-group">

                <label>
                    RERA Number
                </label>

                <input
                    type="text"
                    name="rera_number"
                    value="{{ project.rera_number|default:'' }}"
                    placeholder="RERA number"
                >

            </div>


            <!-- RERA Status -->
            <div class="form-group">

                <label>
                    RERA Status
                </label>

                <input
                    type="text"
                    name="rera_status"
                    value="{{ project.rera_status|default:'' }}"
                    placeholder="Example: Approved / Applied"
                >

            </div>


            <!-- Website -->
            <div class="form-group">

                <label>
                    Website
                </label>

                <input
                    type="url"
                    name="website"
                    value="{{ project.website|default:'' }}"
                    placeholder="https://example.com"
                >

            </div>


            <!-- Google Maps -->
            <div class="form-group">

                <label>
                    Google Maps URL
                </label>

                <input
                    type="url"
                    name="google_maps_url"
                    value="{{ project.google_maps_url|default:'' }}"
                    placeholder="https://maps.google.com/..."
                >

            </div>


            <!-- Amenities -->
            <div class="form-group full-width">

                <label>
                    Amenities
                </label>

                <textarea
                    name="amenities"
                    rows="4"
                    placeholder="Swimming Pool, Clubhouse, Gym, Park..."
                >{{ project.amenities|default:'' }}</textarea>

            </div>


            <!-- Description -->
            <div class="form-group full-width">

                <label>
                    Description
                </label>

                <textarea
                    name="description"
                    rows="5"
                    placeholder="Project description..."
                >{{ project.description|default:'' }}</textarea>

            </div>
             <!-- Active Status --> 
            <div class="form-group"> 
                <label> Status </label> 
                <label class="checkbox"> 
                    <input type="checkbox" name="is_active" {% if project is None or project.is_active %} checked {% endif %} >
                     Active 
                    </label> 
            </div>


        </div>


        <div class="form-actions">

            <a
                href="{% url 'project_list' %}"
                class="btn btn-light">
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary">
                Save Project
            </button>

        </div>

    </form>

</div>

{% endblock %}
