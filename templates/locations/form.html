{% extends "base.html" %}

{% block title %}
{{ title }} | Property CRM
{% endblock %}

{% block page_heading %}
{{ title }}
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>{{ title }}</h1>
        <p>Enter location information.</p>
    </div>

    <a
        href="{% url 'location_list' %}"
        class="btn btn-light">
        ← Back
    </a>

</div>


{% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
{% endif %}

<div class="card form-card">

    <form method="post">

        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Location Name *
                </label>

                <input
                    type="text"
                    name="name"
                    required
                    value="{{ location.name|default:'' }}"
                    placeholder="Example: Kokapet"
                >

            </div>


            <div class="form-group">

                <label>
                    City *
                </label>

                <input
                    type="text"
                    name="city"
                    value="{{ location.city|default:'Hyderabad' }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    State *
                </label>

                <input
                    type="text"
                    name="state"
                    value="{{ location.state|default:'Telangana' }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Pincode
                </label>

                <input
                    type="text"
                    name="pincode"
                    value="{{ location.pincode|default:'' }}"
                    placeholder="500075"
                >

            </div>


            <div class="form-group">

                <label>
                    Latitude
                </label>

                <input
                    type="number"
                    step="0.0000001"
                    name="latitude"
                    value="{{ location.latitude|default:'' }}"
                    placeholder="17.3850440"
                >

            </div>


            <div class="form-group">

                <label>
                    Longitude
                </label>

                <input
                    type="number"
                    step="0.0000001"
                    name="longitude"
                    value="{{ location.longitude|default:'' }}"
                    placeholder="78.4866710"
                >

            </div>


            <div class="form-group full-width">

                <label>
                    Google Maps URL
                </label>

                <input
                    type="url"
                    name="google_maps_url"
                    value="{{ location.google_maps_url|default:'' }}"
                    placeholder="https://maps.google.com/..."
                >

            </div>


            <div class="form-group full-width">

                <label>
                    Description
                </label>

                <textarea
                    name="description"
                    rows="4"
                    placeholder="Location description"
                >{{ location.description|default:'' }}</textarea>

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <label class="checkbox">

                    <input
                        type="checkbox"
                        name="is_active"
                        {% if location is None or location.is_active %}
                            checked
                        {% endif %}
                    >

                    Active

                </label>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{% url 'location_list' %}"
                class="btn btn-light">
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary">
                Save Location
            </button>

        </div>

    </form>

</div>

{% endblock %}
